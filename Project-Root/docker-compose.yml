x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # Internal Kafka broker address for inter-container communication
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  THIRD_PARTY_LOG_LEVEL: ${THIRD_PARTY_LOG_LEVEL:-WARNING}
  KAFKA_LOG_LEVEL: ${KAFKA_LOG_LEVEL:-WARNING}



services:
  data_collector:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: data_collector
    restart: always
    profiles:
      - app_containers
    environment:
      <<: *common-env
      FINNHUB_API_TOKEN: ${FINNHUB_API_TOKEN}
      FINNHUB_WEBSOCKET_URI: ${FINNHUB_WEBSOCKET_URI}
      FINNHUB_STOCK_SYMBOLS: ${FINNHUB_STOCK_SYMBOLS}
      FINNHUB_KAFKA_TOPIC: ${FINNHUB_KAFKA_TOPIC}
      # LOG_LEVEL: ${LOG_LEVEL:-INFO} # We can override the log level for this service if needed, but it's already set in the common-env.
    entrypoint: ["python", "-m", "data_collectors.Finnhub.websocket"]
    networks:
      - app-network
    depends_on:
      kafka:  
        condition: service_healthy  # Ensures that the data_collector service waits for the Kafka service to be healthy before starting. These services takes some time to start up, so this ensures that the data_collector service doesn't attempt to connect to Kafka before it's ready.
      timescale:
        condition: service_healthy


  normalizer:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: normalizer
    restart: always
    profiles:
      - app_containers
    environment:
      <<: *common-env
      FINNHUB_KAFKA_TOPIC:  ${FINNHUB_KAFKA_TOPIC}
      DEAD_LETTER_TOPIC_NORMALIZER: ${DEAD_LETTER_TOPIC_NORMALIZER}
      KAFKA_TOPIC_NORMALIZED_TRADES: ${KAFKA_TOPIC_NORMALIZED_TRADES}
    entrypoint: ["python", "-m", "consumers.normalizer.consumer"]
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy


  candle_builder:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: candle_builder
    profiles:
      - app_containers
    restart: always
    environment:
      <<: *common-env
      KAFKA_TOPIC_NORMALIZED_TRADES: ${KAFKA_TOPIC_NORMALIZED_TRADES}
      KAFKA_TOPIC_CANDLES: ${KAFKA_TOPIC_CANDLES}
      DEAD_LETTER_TOPIC_CANDLE_BUILDER: ${DEAD_LETTER_TOPIC_CANDLE_BUILDER}
    entrypoint: ["python", "-m", "consumers.candle_builder.consumer"]
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy



  indicator_calculator:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: indicator_calculator
    profiles:
      - app_containers
    restart: always
    environment:
      <<: *common-env
      KAFKA_TOPIC_CANDLES: ${KAFKA_TOPIC_CANDLES}
      KAFKA_TOPIC_INDICATOR: ${KAFKA_TOPIC_INDICATOR}
      DEAD_LETTER_TOPIC_INDICATOR: ${DEAD_LETTER_TOPIC_INDICATOR}
    entrypoint: ["python", "-m", "consumers.indicator.consumer"]
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy



  signal_generator:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: signal_generator
    profiles:
      - app_containers
    restart: always
    environment:
      <<: *common-env
      KAFKA_TOPIC_INDICATOR: ${KAFKA_TOPIC_INDICATOR}
      KAFKA_TOPIC_SIGNAL: ${KAFKA_TOPIC_SIGNAL}
      DEAD_LETTER_TOPIC_SIGNAL: ${DEAD_LETTER_TOPIC_SIGNAL}
    entrypoint: ["python", "-m", "consumers.signal_generator.consumer"]
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy


  order_executor:
    image: ${PROJECT_IMAGE}:${PROJECT_VERSION}
    container_name: order_executor
    profiles:
      - app_containers
    restart: always
    environment:
      <<: *common-env
      KAFKA_TOPIC_SIGNAL: ${KAFKA_TOPIC_SIGNAL}
      KAFKA_TOPIC_ORDER_EXECUTOR: ${KAFKA_TOPIC_ORDER_EXECUTOR}
      DEAD_LETTER_TOPIC_ORDER_EXECUTOR: ${DEAD_LETTER_TOPIC_ORDER_EXECUTOR}
      IS_PAPER_TRADING: ${IS_PAPER_TRADING:-True}
      MAX_POSITION_SIZE_PER_SYMBOL: ${MAX_POSITION_SIZE_PER_SYMBOL:-100}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-10}
      MAX_CAPITAL_PER_TRADE: ${MAX_CAPITAL_PER_TRADE:-1000.0}
      MAX_DAILY_LOSS: ${MAX_DAILY_LOSS:-5000.0}
      MAX_ORDERS_PER_MINUTE: ${MAX_ORDERS_PER_MINUTE:-5}
      SIGNAL_MAX_AGE_SECONDS: ${SIGNAL_MAX_AGE_SECONDS:-60}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-60}
    entrypoint: ["python", "-m", "order_executor.consumer"]
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      timescale:
        condition: service_healthy



  kafka:
    # image: apache/kafka:latest
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092" # This is what you'll use from host / Python / aiokafka
      - "29093:29093"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1 # Unique broker ID
      KAFKA_PROCESS_ROLES: broker,controller # Broker (handles data), Controller (handles metadata)
    
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Consumer offsets stored with replication = 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data # By default logs were stored in /tmp/kafka-logs
    restart: always
    networks:
      - infra-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      # - ./data:/var/lib/kafka/data # Where logs are stored
        - kafka-data:/var/lib/kafka/data # Defining named volume for Kafka data persistence 



  kafka-ui:
    # image: kafbat/kafka-ui:latest
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    profiles:
        - infrastructure_containers
    environment:
      KAFKA_CLUSTERS_0_NAME: TBT-Data # Display name in UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 # Initial connection point (bootstrap)
      DYNAMIC_CONFIG_ENABLED: "true" # Allows runtime config updates
    restart: always
    networks:
      - infra-network
    depends_on:
      kafka:
        condition: service_healthy


  timescale:
    # image: timescale/timescaledb:latest-pg16
    image: timescale/timescaledb:2.27.1-pg16
    container_name: timescale
    environment:
    - POSTGRES_USER=${DB_USER}
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    - POSTGRES_DB=${DB_NAME}
    ports:
    - "5432:5432"
    volumes:
    - timescale-data:/var/lib/postgresql/data # Defining named volume
    - ./storage/timescaledb_deployment/migrations:/docker-entrypoint-initdb.d
    networks:
      - infra-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
  


  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: pgadmin
    profiles:
        - infrastructure_containers
    environment:
    - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
    - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
    - "5050:80"
    volumes:
    - ./docker/pgadmin/pgpass:/pgadmin4/pgpass
    - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    restart: always
    networks:
      - infra-network
    depends_on:
      timescale:
        condition: service_healthy


volumes:
  timescale-data:
  kafka-data:

networks:
  infra-network:
    driver: bridge
  app-network:
    driver: bridge



# Note: -

# What healthchecks actually do — explained simply
# Without a healthcheck, Docker only knows if a container's process is running.
# But "process running" ≠ "service ready":

# Kafka's JVM starts in ~2s but Kafka itself takes 15–30s to elect a controller and be ready to accept connections
# TimescaleDB's process starts fast but PostgreSQL needs a few seconds to finish initializing the data directory
# depends_on: condition: service_healthy tells Docker: don't start my container until the dependency
# passes its health test. The healthcheck block defines what test to run. Without the healthcheck block,
#  Docker has no test to run, so the condition can never be satisfied — your app containers would either hang waiting or never start.



# We are not keeping the kafka and timescale under any profile, as they are core services and not the optional ones
# They should always be up and running for any of the app services to work. The other services can be started or stopped based on the profile selected.
# Since the kafka-ui and pgadmin are optional services, they are kept under the infrastructure_containers profile. They can be started or stopped based on the profile selected.




'''
# ****************************** Some Useful Commands ******************************


1.) To start all services (including optional ones like kafka-ui and pgadmin):
    docker-compose --profile infrastructure_containers --profile app_containers up -d
      or 
    docker-compose --profile "*" up -d
  
2.) To start all the services without building the images (if they are already built):
    docker-compose --profile "*" up -d

3.) To start all the services and build the images (if they are not built or if there are changes in the Dockerfile):
    docker-compose --profile "*" up -d --build  

4.) To start only the core services (data_collector, normalizer, candle_builder, indicator_calculator, signal_generator, order_executor, kafka, timescale):
    docker-compose --profile app_containers up -d

5.) To start only the optional services (kafka-ui, pgadmin):
    docker-compose --profile infrastructure_containers up -d

6.) To start a specific service (e.g., data_collector) without starting its dependencies:
    docker-compose up -d --no-deps <service_name>
# --no-deps will start the specified service without starting any of its dependencies. This is useful if you want to start a service that depends on other services, but you know those other services are already running and healthy. For example, if you want to restart the order_executor service without restarting kafka or timescale, you can use this command.

'''